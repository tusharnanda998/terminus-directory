<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINUS.DIRECTORY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudinary Upload Widget Script -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* Direct CDN Links to GitHub Repository TTF Files via jsDelivr */
    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    body, button, input, select, textarea, span, div, p, header, footer { 
      font-family: 'Eurostile', sans-serif !important; 
    }

    /* Vertical 9-Stitch Needling Overlay */
    .stitch-overlay-vertical {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 33px;
      pointer-events: none;
      z-index: 5;
      background-image: repeating-linear-gradient(
        90deg,
        #d4d4d4 0px,
        #d4d4d4 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.85;
    }

    /* Edge-to-Edge Horizontal 9-Stitch Needling (33px height = exactly 9 lines) */
    .stitch-overlay-header-horizontal {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 33px;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-linear-gradient(
        0deg,
        #d4d4d4 0px,
        #d4d4d4 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.85;
    }
  </style>
</head>
<body class="bg-white text-black antialiased min-h-screen p-4 md:p-12 relative overflow-x-hidden">

  <!-- Continuous Vertical 9-Line Stitch Needling Overlay -->
  <div class="stitch-overlay-vertical"></div>

  <!-- Header with Seamless Integrated Horizontal 9-Stitch Needling -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-sm mb-8 text-[11px] tracking-widest uppercase relative h-[33px] flex items-center">
    
    <!-- Full-Width Horizontal 9-Stitch Background Overlay in Header -->
    <div class="stitch-overlay-header-horizontal"></div>

    <div class="flex justify-between items-center w-full relative z-20">
      <!-- Left Side: Upload Trigger -->
      <div>
        <button id="upload_widget" class="bg-white text-black border border-neutral-300 px-3 py-1 text-[9px] hover:bg-neutral-100 transition-colors uppercase cursor-pointer">
          + UPLOAD ENTRY
        </button>
      </div>

      <!-- Right Side: Feed Filter Tabs -->
      <div class="flex items-center space-x-4">
        <button id="tab-all" onclick="switchTab('all')" class="font-bold text-black cursor-pointer">INDEX</button>
        <button id="tab-saved" onclick="switchTab('saved')" class="text-neutral-400 hover:text-black transition-colors cursor-pointer">SAVED (<span id="saved-count">0</span>)</button>
      </div>
    </div>
  </header>

  <!-- Seamless Feed Container -->
  <main id="archive-feed" class="max-w-4xl mx-auto divide-y divide-neutral-200 relative z-20">
    <!-- Dynamic slides load here automatically -->
  </main>

  <footer class="mt-16 pt-6 border-t border-neutral-200 text-neutral-400 text-[10px] flex justify-between relative z-20">
    <p>&copy; TERMINUS.DIRECTORY</p>
    <p>ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- Expanded Image Modal Lightbox -->
  <div 
    id="lightbox" 
    onclick="closeLightbox()" 
    class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md hidden flex items-center justify-center p-4 sm:p-8 cursor-zoom-out"
  >
    <img 
      id="lightbox-img" 
      src="" 
      alt="Expanded Research Item" 
      class="max-h-[90vh] max-w-[90vw] object-contain shadow-2xl transition-transform duration-200"
    >
    <button 
      onclick="closeLightbox()" 
      class="absolute top-6 right-6 text-neutral-500 hover:text-black text-[11px] uppercase tracking-widest"
    >
      [ CLOSE ✕ ]
    </button>
  </div>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
      
      // 1. CLOUDINARY & TEAM CONFIG
      const CLOUD_NAME = "nh2yb4q3";
      const UPLOAD_PRESET = "terminus_preset";

      // Founders Key Mapping (5 Passcodes -> 5 Signatures/Initials)
      const FOUNDER_KEYS = {
        "TN01": "TN",
        "MM02": "MM",
        "TS03": "TS",
        "JW04": "Woods",
        "KJ05": "KJJ",
        "Glendale": "TERMINUS TEAM" // Legacy fallback key
      };

      // Active uploader state
      let activeUploaderInitials = null;

      // 2. YOUR FIREBASE CONFIG
      const firebaseConfig = {
        apiKey: "AIzaSyABHPbsfb7wLbLsipwidq4oQqrLdiUrho",
        authDomain: "terminus-projects-llc.firebaseapp.com",
        projectId: "terminus-projects-llc",
        storageBucket: "terminus-projects-llc.firebasestorage.app",
        messagingSenderId: "132476018158",
        appId: "1:132476018158:web:f47cc816139b3f403742ff",
        measurementId: "G-4ZSN6M7NG1"
      };

      // Initialize Firebase & Firestore
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // State Management
      let allDocs = [];
      let currentTab = "all"; 
      let savedIds = JSON.parse(localStorage.getItem("terminus_saved_cards") || "[]");

      function updateSavedBadge() {
        document.getElementById("saved-count").innerText = savedIds.length;
      }
      updateSavedBadge();

      // 3. SEAMLESS SLIDE TEMPLATE RENDERER
      function renderCard(docId, imageUrl, entryNum, captionText = "RESEARCH", signature = "") {
        const isSaved = docId && savedIds.includes(docId);
        const metaLine = signature ? `${captionText} | ${signature}` : captionText;
        const formattedNum = String(entryNum).padStart(3, '0');

        return `
          <article class="py-12 md:py-20 min-h-[85vh] flex flex-col justify-between">
            <!-- Top Bar -->
            <div class="flex justify-between items-start text-[9px] tracking-widest text-neutral-500 uppercase">
              <span>TERMINUS PROJECTS LLC ©</span>
              <span>${formattedNum}</span>
            </div>

            <!-- Image Subject -->
            <div class="relative my-auto py-8 flex justify-center items-center">
              <img 
                src="${imageUrl}" 
                alt="Research Item" 
                onclick="openLightbox('${imageUrl}')"
                class="max-h-[60vh] w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300 relative z-20 cursor-zoom-in bg-white"
              >
            </div>

            <!-- Bottom Bar -->
            <div class="flex justify-between items-end text-[9px] tracking-widest text-neutral-400 uppercase">
              <!-- Bottom Left: Compact Action Icons (Circle Bookmark + Delete) -->
              <div class="flex items-center space-x-2.5">
                ${docId ? `
                  <button 
                    onclick="toggleSave('${docId}')" 
                    class="${isSaved ? 'text-black' : 'text-neutral-500 hover:text-black'} transition-colors cursor-pointer flex items-center justify-center"
                    title="${isSaved ? 'Remove Bookmark' : 'Save Entry'}"
                  >
                    ${isSaved ? `
                      <!-- Solid Circle when Saved -->
                      <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                      </svg>
                    ` : `
                      <!-- Outlined Circle when Unsaved -->
                      <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                      </svg>
                    `}
                  </button>
                  <button 
                    onclick="deleteCard('${docId}')" 
                    class="text-neutral-500 hover:text-black transition-colors cursor-pointer flex items-center justify-center" 
                    title="Delete Entry"
                  >
                    <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                ` : ''}
              </div>

              <!-- Bottom Right: Caption | Initials -->
              <div>
                <span>${metaLine}</span>
              </div>
            </div>
          </article>
        `;
      }

      // LIGHTBOX EXPAND HANDLERS
      window.openLightbox = function(imageUrl) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = imageUrl;
        lightbox.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      };

      window.closeLightbox = function() {
        const lightbox = document.getElementById("lightbox");
        lightbox.classList.add("hidden");
        document.body.style.overflow = "auto";
      };

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
          closeLightbox();
        }
      });

      // GLOBAL BOOKMARK TOGGLE
      window.toggleSave = function(docId) {
        if (savedIds.includes(docId)) {
          savedIds = savedIds.filter(id => id !== docId);
        } else {
          savedIds.push(docId);
        }
        localStorage.setItem("terminus_saved_cards", JSON.stringify(savedIds));
        updateSavedBadge();
        renderFeed();
      };

      // GLOBAL TAB SWITCHER
      window.switchTab = function(tab) {
        currentTab = tab;
        const allBtn = document.getElementById("tab-all");
        const savedBtn = document.getElementById("tab-saved");

        if (tab === "all") {
          allBtn.className = "font-bold text-black cursor-pointer";
          savedBtn.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer";
        } else {
          savedBtn.className = "font-bold text-black cursor-pointer";
          allBtn.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer";
        }
        renderFeed();
      };

      // GLOBAL DELETE FUNCTION
      window.deleteCard = function(docId) {
        const userInput = prompt("ENTER ACCESS KEY TO DELETE:");
        if (FOUNDER_KEYS[userInput]) {
          if (confirm("Permanently delete this research card?")) {
            if (savedIds.includes(docId)) {
              toggleSave(docId);
            }
            db.collection("posts").doc(docId).delete().catch((error) => {
              alert("Error deleting card: " + error.message);
            });
          }
        } else if (userInput !== null) {
          alert("ACCESS DENIED: INVALID KEY");
        }
      };

      // RENDER FEED BASED ON ACTIVE TAB
      function renderFeed() {
        const feedContainer = document.getElementById("archive-feed");
        feedContainer.innerHTML = ""; 

        let docsToRender = allDocs;
        if (currentTab === "saved") {
          docsToRender = allDocs.filter(doc => savedIds.includes(doc.id));
        }

        if (docsToRender.length === 0) {
          if (currentTab === "saved") {
            feedContainer.innerHTML = `
              <div class="text-center py-24 text-[11px] text-neutral-400 uppercase tracking-widest">
                NO SAVED ENTRIES IN YOUR ARCHIVE.
              </div>
            `;
          } else {
            feedContainer.innerHTML = renderCard(null, "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80", 1, "LOOK 01 ARCHIVE", "TN");
          }
          return;
        }

        let totalDocs = allDocs.length;
        docsToRender.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;
          const indexInAll = allDocs.findIndex(d => d.id === docId);
          const entryNum = totalDocs - indexInAll;
          const captionText = data.caption || "RESEARCH";
          const signature = data.uploadedBy || "";
          feedContainer.insertAdjacentHTML("beforeend", renderCard(docId, data.imageUrl, entryNum, captionText, signature));
        });
      }

      // 4. LOAD REAL-TIME CARDS FROM FIREBASE
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allDocs = snapshot.docs;
        renderFeed();
      });

      // 5. CLOUDINARY UPLOAD HANDLER WITH AUTO SIGNATURE
      const myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'url', 'camera'],
        multiple: false,
        maxFiles: 1
      }, (error, result) => { 
        if (!error && result && result.event === "success") {
          const uploadedUrl = result.info.secure_url;
          
          // Prompt uploader for a 2-3 word caption
          const userCaption = prompt("ENTER A 2-3 WORD DESCRIPTION FOR THIS ENTRY:", "RESEARCH");
          const finalCaption = (userCaption && userCaption.trim() !== "") ? userCaption.trim().toUpperCase() : "RESEARCH";

          db.collection("posts").add({
            imageUrl: uploadedUrl,
            caption: finalCaption,
            uploadedBy: activeUploaderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      });

      // Passcode Handler for Upload
      const uploadBtn = document.getElementById("upload_widget");
      if (uploadBtn) {
        uploadBtn.addEventListener("click", function(){
          const userInput = prompt("ENTER YOUR PERSONAL ACCESS KEY:");
          if (FOUNDER_KEYS[userInput]) {
            activeUploaderInitials = FOUNDER_KEYS[userInput];
            myWidget.open();
          } else if (userInput !== null) {
            alert("ACCESS DENIED: INVALID KEY");
          }
        });
      }
    });
  </script>

</body>
</html>
