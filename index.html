<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINUS.DIRECTORY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudinary Upload Widget Script -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* Direct CDN Links to GitHub Repository TTF Files via jsDelivr */
    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    body, button, input, select, textarea, span, div, p, header, footer, a { 
      font-family: 'Eurostile', sans-serif !important; 
    }

    /* Vertical Fine 9-Stitch Needling Overlay */
    .stitch-overlay-vertical {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      pointer-events: none;
      z-index: 5;
      background-image: repeating-linear-gradient(
        90deg,
        #cccccc 0px,
        #cccccc 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.7;
    }

    /* Edge-to-Edge Horizontal 9-Stitch Needling for Header & Footer */
    .stitch-overlay-horizontal {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 18px;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-linear-gradient(
        0deg,
        #cccccc 0px,
        #cccccc 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.7;
    }

    /* MOBILE & DESKTOP PRINT ENGINE */
    @page {
      size: letter portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body > *:not(#print-stage) {
        display: none !important;
      }

      #print-stage {
        display: block !important;
        width: 100% !important;
      }

      .print-page {
        width: 100% !important;
        height: 100vh !important;
        max-height: 100vh !important;
        padding: 0.4in !important;
        box-sizing: border-box !important;
        position: relative !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }

      .print-page:not(:last-child) {
        page-break-after: always !important;
        break-after: page !important;
      }

      .print-stitch-vertical {
        position: absolute !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 18px !important;
        pointer-events: none !important;
        z-index: 5 !important;
        background-image: repeating-linear-gradient(
          90deg,
          #b3b3b3 0px,
          #b3b3b3 1px,
          transparent 1px,
          transparent 2px
        ) !important;
        opacity: 0.65 !important;
      }
    }

    #print-stage {
      display: none;
    }
  </style>
</head>
<body class="bg-white text-black antialiased min-h-screen p-4 md:p-12 relative overflow-x-hidden">

  <!-- Continuous Vertical Fine 9-Line Stitch Needling Overlay -->
  <div class="stitch-overlay-vertical"></div>

  <!-- Header Perfectly Aligned Centrally Over 18px Horizontal Stitch Band -->
  <header class="sticky top-0 z-40 bg-transparent mb-6 text-[11px] tracking-widest uppercase relative h-[18px] flex items-center justify-center">
    
    <!-- Full-Width Horizontal 9-Stitch Background Overlay in Header -->
    <div class="stitch-overlay-horizontal"></div>

    <div class="flex justify-between items-center w-full relative z-20 h-full">
      <!-- Left Side: Dynamic Upload Trigger -->
      <div class="flex items-center h-full">
        <button id="upload_widget" class="bg-white text-black border border-neutral-300 px-2 py-0.5 text-[9px] hover:bg-neutral-100 transition-colors uppercase cursor-pointer leading-none flex items-center">
          + UPLOAD ENTRY
        </button>
      </div>

      <!-- Right Side: Main Tabs + PDF Export Trigger -->
      <div class="flex items-center space-x-4 h-full leading-none">
        <button id="tab-all" onclick="switchMainTab('all')" class="font-bold text-black cursor-pointer leading-none">INDEX</button>
        <button id="tab-saved" onclick="switchMainTab('saved')" class="text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none">SAVED (<span id="saved-count">0</span>)</button>
        <button id="export-pdf-btn" onclick="exportSavedPDF()" class="hidden text-black underline hover:text-neutral-600 transition-colors cursor-pointer text-[9px] leading-none">EXPORT PDF</button>
      </div>
    </div>
  </header>

  <!-- INDEX SUB-NAV (Filter between Images, Text & Links, or All) -->
  <div id="index-subnav" class="max-w-4xl mx-auto mb-8 flex justify-end items-center space-x-3 text-[9px] tracking-widest uppercase relative z-20">
    <span class="text-neutral-300">FILTER:</span>
    <button id="subtab-all" onclick="setIndexFilter('all')" class="font-bold text-black cursor-pointer">ALL</button>
    <span class="text-neutral-300">/</span>
    <button id="subtab-images" onclick="setIndexFilter('images')" class="text-neutral-400 hover:text-black transition-colors cursor-pointer">IMAGES</button>
    <span class="text-neutral-300">/</span>
    <button id="subtab-text" onclick="setIndexFilter('text')" class="text-neutral-400 hover:text-black transition-colors cursor-pointer">TEXT & LINKS</button>
  </div>

  <!-- Seamless Feed Container -->
  <main id="archive-feed" class="max-w-4xl mx-auto divide-y divide-neutral-200 relative z-20">
    <!-- Dynamic slides load here automatically -->
  </main>

  <!-- Footer Layout -->
  <footer class="mt-20 mb-8 text-[9px] tracking-widest uppercase relative z-20">
    <!-- Row 1: Aligned Centrally Over 18px Horizontal Stitch Band -->
    <div class="relative h-[18px] flex items-center justify-center">
      <!-- Full-Width Horizontal 9-Stitch Background Overlay in Footer -->
      <div class="stitch-overlay-horizontal"></div>

      <div class="flex justify-between items-center w-full relative z-20 text-neutral-400 h-full leading-none">
        <p class="leading-none">&copy; TERMINUS.DIRECTORY</p>

        <!-- Center Link -->
        <a 
          href="https://terminus-ix.com" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="hover:text-black transition-colors underline cursor-pointer leading-none"
        >
          TERMINUS-IX.COM
        </a>

        <p class="leading-none">ALL RIGHTS RESERVED.</p>
      </div>
    </div>

    <!-- Row 2: Legal Disclaimer Centered Below the Stitch Band -->
    <div class="relative z-20 text-[8px] text-neutral-400 tracking-wider text-center lowercase mt-4">
      <span>we do not claim ownership of any images unless specified. for copyright inquiries or removal requests, contact </span>
      <a href="mailto:admin@terminus-ix.com" class="underline hover:text-black">admin@terminus-ix.com</a>
    </div>
  </footer>

  <!-- Container for Native Browser Print Execution -->
  <div id="print-stage"></div>

  <!-- Expanded Image Modal Lightbox -->
  <div 
    id="lightbox" 
    onclick="closeLightbox()" 
    class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md hidden flex items-center justify-center p-4 sm:p-8 cursor-zoom-out"
  >
    <img 
      id="lightbox-img" 
      src="" 
      alt="Expanded Research Item" 
      class="max-h-[90vh] max-w-[90vw] object-contain shadow-2xl transition-transform duration-200"
    >
    <button 
      onclick="closeLightbox()" 
      class="absolute top-6 right-6 text-neutral-500 hover:text-black text-[11px] uppercase tracking-widest"
    >
      [ CLOSE ✕ ]
    </button>
  </div>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
      
      // 1. CLOUDINARY & TEAM CONFIG
      const CLOUD_NAME = "nh2yb4q3";
      const UPLOAD_PRESET = "terminus_preset";

      // Founders Key Mapping
      const FOUNDER_KEYS = {
        "TN": "TN",
        "MM": "MM",
        "TS": "TS",
        "JW": "Woods",
        "KJJ": "KJJ",
        "Glendale": "TERMINUS TEAM"
      };

      let activeUploaderInitials = null;

      // 2. FIREBASE CONFIG
      const firebaseConfig = {
        apiKey: "AIzaSyABHPbsfb7wLbLsipwidq4oQqrLdiUrho",
        authDomain: "terminus-projects-llc.firebaseapp.com",
        projectId: "terminus-projects-llc",
        storageBucket: "terminus-projects-llc.firebasestorage.app",
        messagingSenderId: "132476018158",
        appId: "1:132476018158:web:f47cc816139b3f403742ff",
        measurementId: "G-4ZSN6M7NG1"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // State Management
      let allDocs = [];
      let currentMainTab = "all"; // 'all' (Index), 'saved'
      let indexFilter = "all";    // 'all', 'images', 'text'
      let savedIds = JSON.parse(localStorage.getItem("terminus_saved_cards") || "[]");

      function updateSavedBadge() {
        document.getElementById("saved-count").innerText = savedIds.length;
      }
      updateSavedBadge();

      // 3. SEAMLESS CARD RENDERER
      function renderCard(docId, data, entryNum) {
        const isSaved = docId && savedIds.includes(docId);
        const captionText = data.caption || "RESEARCH";
        const signature = data.uploadedBy || "";
        const metaLine = signature ? `${captionText} | ${signature}` : captionText;
        const formattedNum = String(entryNum).padStart(3, '0');

        let mainContent = '';

        if (data.type === "link") {
          mainContent = `
            <div class="relative my-auto py-12 flex flex-col justify-center items-center text-center bg-neutral-50 border border-neutral-200 p-8 max-w-xl mx-auto w-full z-20">
              <span class="text-[9px] uppercase tracking-widest text-neutral-400 mb-2">EXTERNAL REFERENCE</span>
              <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="text-sm md:text-base font-bold text-black hover:underline break-all mb-4">
                ${data.url}
              </a>
              ${data.note ? `<p class="text-[11px] text-neutral-600 tracking-wide uppercase">${data.note}</p>` : ''}
            </div>
          `;
        } else if (data.type === "text") {
          mainContent = `
            <div class="relative my-auto py-12 flex flex-col justify-center items-center text-center bg-white border border-neutral-200 p-8 max-w-2xl mx-auto w-full z-20">
              <blockquote class="text-sm md:text-base text-black tracking-wide leading-relaxed uppercase whitespace-pre-line">
                "${data.textContent}"
              </blockquote>
            </div>
          `;
        } else {
          mainContent = `
            <div class="relative my-auto py-8 flex justify-center items-center">
              <img 
                src="${data.imageUrl}" 
                alt="Research Item" 
                onclick="openLightbox('${data.imageUrl}')"
                class="max-h-[60vh] w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300 relative z-20 cursor-zoom-in bg-white"
                crossorigin="anonymous"
              >
            </div>
          `;
        }

        return `
          <article class="py-12 md:py-20 min-h-[85vh] flex flex-col justify-between">
            <!-- Top Bar -->
            <div class="flex justify-between items-start text-[9px] tracking-widest text-neutral-500 uppercase">
              <span>TERMINUS PROJECTS LLC ©</span>
              <span>${formattedNum}</span>
            </div>

            <!-- Subject -->
            ${mainContent}

            <!-- Bottom Bar -->
            <div class="flex justify-between items-end text-[9px] tracking-widest text-neutral-400 uppercase">
              <!-- Bottom Left: Action Icons -->
              <div class="flex items-center space-x-2.5">
                ${docId ? `
                  <button 
                    onclick="toggleSave('${docId}')" 
                    class="${isSaved ? 'text-black' : 'text-neutral-500 hover:text-black'} transition-colors cursor-pointer flex items-center justify-center"
                    title="${isSaved ? 'Remove Bookmark' : 'Save Entry'}"
                  >
                    ${isSaved ? `
                      <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                      </svg>
                    ` : `
                      <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                      </svg>
                    `}
                  </button>
                  <button 
                    onclick="deleteCard('${docId}')" 
                    class="text-neutral-500 hover:text-black transition-colors cursor-pointer flex items-center justify-center" 
                    title="Delete Entry"
                  >
                    <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                ` : ''}
              </div>

              <!-- Bottom Right: Caption | Initials -->
              <div>
                <span>${metaLine}</span>
              </div>
            </div>
          </article>
        `;
      }

      // LIGHTBOX EXPAND HANDLERS
      window.openLightbox = function(imageUrl) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = imageUrl;
        lightbox.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      };

      window.closeLightbox = function() {
        const lightbox = document.getElementById("lightbox");
        lightbox.classList.add("hidden");
        document.body.style.overflow = "auto";
      };

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closeLightbox();
      });

      // GLOBAL BOOKMARK TOGGLE
      window.toggleSave = function(docId) {
        if (savedIds.includes(docId)) {
          savedIds = savedIds.filter(id => id !== docId);
        } else {
          savedIds.push(docId);
        }
        localStorage.setItem("terminus_saved_cards", JSON.stringify(savedIds));
        updateSavedBadge();
        renderFeed();
      };

      // TAB CONTROLLERS
      window.switchMainTab = function(tab) {
        currentMainTab = tab;
        const allBtn = document.getElementById("tab-all");
        const savedBtn = document.getElementById("tab-saved");
        const exportBtn = document.getElementById("export-pdf-btn");
        const subNav = document.getElementById("index-subnav");

        if (tab === "all") {
          allBtn.className = "font-bold text-black cursor-pointer leading-none";
          savedBtn.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none";
          exportBtn.classList.add("hidden");
          subNav.classList.remove("hidden");
        } else {
          savedBtn.className = "font-bold text-black cursor-pointer leading-none";
          allBtn.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none";
          subNav.classList.add("hidden");
          if (savedIds.length > 0) exportBtn.classList.remove("hidden");
        }
        renderFeed();
      };

      window.setIndexFilter = function(filter) {
        indexFilter = filter;
        const subAll = document.getElementById("subtab-all");
        const subImages = document.getElementById("subtab-images");
        const subText = document.getElementById("subtab-text");

        subAll.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer";
        subImages.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer";
        subText.className = "text-neutral-400 hover:text-black transition-colors cursor-pointer";

        if (filter === "all") subAll.className = "font-bold text-black cursor-pointer";
        if (filter === "images") subImages.className = "font-bold text-black cursor-pointer";
        if (filter === "text") subText.className = "font-bold text-black cursor-pointer";

        renderFeed();
      };

      // GLOBAL DELETE FUNCTION
      window.deleteCard = function(docId) {
        const userInput = prompt("ENTER ACCESS KEY TO DELETE:");
        if (FOUNDER_KEYS[userInput]) {
          if (confirm("Permanently delete this research card?")) {
            if (savedIds.includes(docId)) toggleSave(docId);
            db.collection("posts").doc(docId).delete().catch((error) => {
              alert("Error deleting card: " + error.message);
            });
          }
        } else if (userInput !== null) {
          alert("ACCESS DENIED: INVALID KEY");
        }
      };

      // NATIVE PRINT ENGINE
      window.exportSavedPDF = async function() {
        if (savedIds.length === 0) return;

        const stage = document.getElementById("print-stage");
        stage.innerHTML = ""; 

        const docsToRender = allDocs.filter(doc => savedIds.includes(doc.id));
        const totalDocs = allDocs.length;

        docsToRender.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;
          const indexInAll = allDocs.findIndex(d => d.id === docId);
          const entryNum = totalDocs - indexInAll;
          const formattedNum = String(entryNum).padStart(3, '0');
          const captionText = data.caption || "RESEARCH";
          const signature = data.uploadedBy || "";
          const metaLine = signature ? `${captionText} | ${signature}` : captionText;

          let bodyHTML = '';
          if (data.type === "link") {
            bodyHTML = `<div class="my-auto py-8 text-center text-xs font-bold uppercase">${data.url}</div>`;
          } else if (data.type === "text") {
            bodyHTML = `<div class="my-auto py-8 text-center text-xs uppercase px-6">"${data.textContent}"</div>`;
          } else {
            bodyHTML = `
              <div class="my-auto py-2 flex justify-center items-center relative z-20" style="flex: 1; min-height: 0;">
                <img 
                  src="${data.imageUrl}" 
                  alt="Research Item" 
                  style="max-height: 100%; max-width: 100%; object-fit: contain; display: block; margin: 0 auto;"
                  class="bg-white"
                  crossorigin="anonymous"
                >
              </div>
            `;
          }

          const pageHTML = `
            <div class="print-page">
              <div class="print-stitch-vertical"></div>

              <div class="flex justify-between items-start text-[10px] tracking-widest text-neutral-500 uppercase relative z-20">
                <span>TERMINUS PROJECTS LLC ©</span>
                <span>${formattedNum}</span>
              </div>

              ${bodyHTML}

              <div class="flex justify-between items-end text-[10px] tracking-widest text-neutral-500 uppercase relative z-20">
                <span>TRMNS</span>
                <span>${metaLine}</span>
              </div>
            </div>
          `;
          stage.insertAdjacentHTML("beforeend", pageHTML);
        });

        const images = stage.querySelectorAll("img");
        const imagePromises = Array.from(images).map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        });
        await Promise.all(imagePromises);

        window.print();
      };

      // RENDER FEED BASED ON ACTIVE TAB & SUB-NAV FILTER
      function renderFeed() {
        const feedContainer = document.getElementById("archive-feed");
        feedContainer.innerHTML = ""; 

        let docsToRender = allDocs;

        if (currentMainTab === "saved") {
          docsToRender = allDocs.filter(doc => savedIds.includes(doc.id));
        } else {
          // INDEX TAB FILTERS
          if (indexFilter === "images") {
            docsToRender = allDocs.filter(doc => !doc.data().type || doc.data().type === "image");
          } else if (indexFilter === "text") {
            docsToRender = allDocs.filter(doc => doc.data().type === "text" || doc.data().type === "link");
          }
        }

        if (docsToRender.length === 0) {
          feedContainer.innerHTML = `
            <div class="text-center py-24 text-[11px] text-neutral-400 uppercase tracking-widest">
              NO ENTRIES FOUND IN THIS SECTION.
            </div>
          `;
          return;
        }

        let totalDocs = allDocs.length;
        docsToRender.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;
          const indexInAll = allDocs.findIndex(d => d.id === docId);
          const entryNum = totalDocs - indexInAll;
          feedContainer.insertAdjacentHTML("beforeend", renderCard(docId, data, entryNum));
        });
      }

      // LOAD FIREBASE REALTIME POSTS
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allDocs = snapshot.docs;
        renderFeed();
      });

      // CLOUDINARY WIDGET
      const myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'url', 'camera'],
        multiple: false,
        maxFiles: 1
      }, (error, result) => { 
        if (!error && result && result.event === "success") {
          const uploadedUrl = result.info.secure_url;
          
          const userCaption = prompt("ENTER A 2-3 WORD DESCRIPTION FOR THIS ENTRY:", "RESEARCH");
          const finalCaption = (userCaption && userCaption.trim() !== "") ? userCaption.trim().toUpperCase() : "RESEARCH";

          db.collection("posts").add({
            type: "image",
            imageUrl: uploadedUrl,
            caption: finalCaption,
            uploadedBy: activeUploaderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      });

      // UPLOAD BUTTON DISPATCHER
      const uploadBtn = document.getElementById("upload_widget");
      if (uploadBtn) {
        uploadBtn.addEventListener("click", function(){
          const userInput = prompt("ENTER YOUR PERSONAL ACCESS KEY:");
          if (!FOUNDER_KEYS[userInput]) {
            if (userInput !== null) alert("ACCESS DENIED: INVALID KEY");
            return;
          }

          activeUploaderInitials = FOUNDER_KEYS[userInput];

          // If user selected Text/Links filter or explicitly chooses to upload Text/Link
          if (indexFilter === "text") {
            handleTextOrLinkUpload();
          } else if (indexFilter === "images") {
            myWidget.open();
          } else {
            // "ALL" Filter active: Prompt user which format they want to upload
            const choice = prompt("SELECT UPLOAD TYPE:\n1 = IMAGE\n2 = TEXT NOTE / LINK", "1");
            if (choice === "1") {
              myWidget.open();
            } else if (choice === "2") {
              handleTextOrLinkUpload();
            }
          }
        });
      }

      function handleTextOrLinkUpload() {
        const entryType = prompt("ENTER ENTRY TYPE:\n1 = LINK / URL\n2 = TEXT NOTE", "1");
        
        if (entryType === "1") {
          const urlInput = prompt("ENTER FULL URL (e.g. https://example.com):");
          if (!urlInput || urlInput.trim() === "") return;
          
          const noteInput = prompt("ENTER BRIEF NOTE OR CAPTION (OPTIONAL):", "REFERENCE LINK");
          
          db.collection("posts").add({
            type: "link",
            url: urlInput.trim(),
            note: noteInput ? noteInput.trim().toUpperCase() : "",
            caption: "LINK ENTRY",
            uploadedBy: activeUploaderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else if (entryType === "2") {
          const textInput = prompt("ENTER YOUR TEXT NOTE OR EXCERPT:");
          if (!textInput || textInput.trim() === "") return;

          const captionInput = prompt("ENTER A 2-3 WORD DESCRIPTION:", "NOTE");

          db.collection("posts").add({
            type: "text",
            textContent: textInput.trim(),
            caption: captionInput ? captionInput.trim().toUpperCase() : "NOTE",
            uploadedBy: activeUploaderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }

    });
  </script>

</body>
</html>
