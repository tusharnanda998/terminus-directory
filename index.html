<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINUS.DIRECTORY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudinary Upload Widget Script -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- html2pdf Library for Mobile & Desktop PDF Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- jsPDF and html2canvas loaded explicitly and separately: the html2pdf
       bundle does not reliably expose either on window, so we load their
       own UMD builds here to guarantee window.jspdf.jsPDF and
       window.html2canvas are both available. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Prevent iOS Safari from automatically inflating small text sizes
       ("font boosting"), which was silently rendering header/nav text
       larger on mobile than the declared font-size and breaking any
       fixed-height vertical centering. */
    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Direct CDN Links to GitHub Repository TTF Files via jsDelivr */
    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Eurostile';
      src: url('https://cdn.jsdelivr.net/gh/Kyles-World/Eurostile-Font@main/Eurostile%20(Original%20Version)/Eurostile%20Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    body, button, input, select, textarea, span, div, p, header, footer, a { 
      font-family: 'Eurostile', sans-serif !important; 
    }

    /* Vertical Fine 9-Stitch Needling Overlay */
    .stitch-overlay-vertical {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      pointer-events: none;
      z-index: 5;
      background-image: repeating-linear-gradient(
        90deg,
        #cccccc 0px,
        #cccccc 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.7;
    }

    /* Edge-to-Edge Horizontal 9-Stitch Needling for Header & Footer */
    .stitch-overlay-horizontal {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-linear-gradient(
        0deg,
        #cccccc 0px,
        #cccccc 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.7;
    }

    #print-stage {
      display: none;
    }
  </style>
</head>
<body class="bg-white text-black antialiased min-h-screen p-4 md:p-12 relative overflow-x-hidden">

  <!-- Continuous Vertical Fine 9-Line Stitch Needling Overlay -->
  <div class="stitch-overlay-vertical"></div>

  <!-- Header Container -->
  <header class="sticky top-0 z-40 bg-transparent mb-0.5 text-[11px] tracking-widest uppercase relative min-h-[18px] flex items-center justify-center">
    
    <!-- Full-Width Horizontal 9-Stitch Background Overlay in Header -->
    <div class="stitch-overlay-horizontal"></div>

    <div class="flex justify-between items-center w-full relative z-20 h-full">
      <!-- Left Side: Sign In / Dynamic Upload Trigger -->
      <div class="flex items-center h-full space-x-2">
        <button id="signin_widget" class="appearance-none m-0 bg-white text-black border border-neutral-300 px-1.5 h-[15px] box-border text-[8px] hover:bg-neutral-100 transition-colors uppercase cursor-pointer leading-none flex items-center justify-center">
          SIGN IN
        </button>
        <button id="upload_widget" class="hidden appearance-none m-0 bg-white text-black border border-neutral-300 px-1.5 h-[15px] box-border text-[8px] hover:bg-neutral-100 transition-colors uppercase cursor-pointer leading-none flex items-center justify-center">
          + UPLOAD ENTRY
        </button>
      </div>

      <!-- Right Side: Main Tabs + PDF Export Trigger -->
      <div class="flex items-center h-full leading-none">
        <div class="flex items-center h-[18px] space-x-4">
          <button id="tab-all" onclick="switchMainTab('all')" class="appearance-none m-0 p-0 bg-transparent border-0 font-bold text-black cursor-pointer leading-none flex items-center h-[18px]">INDEX</button>
          <button id="tab-saved" onclick="switchMainTab('saved')" class="appearance-none m-0 p-0 bg-transparent border-0 text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none flex items-center h-[18px]">SAVED (<span id="saved-count">0</span>)</button>
        </div>
      </div>
    </div>
  </header>

  <!-- INDEX SUB-NAV -->
  <div id="index-subnav" class="w-full sticky top-[20px] z-30 mb-8 flex justify-between items-center">
    <div class="flex items-center space-x-2 text-[9px] tracking-widest uppercase bg-white pl-[7px] pr-4 py-1">
      <button id="subtab-images" onclick="toggleIndexFilter('images')" class="font-bold text-black cursor-pointer transition-colors">IMAGES</button>
      <span class="text-neutral-300">|</span>
      <button id="subtab-text" onclick="toggleIndexFilter('text')" class="font-bold text-black cursor-pointer transition-colors">TEXT</button>
    </div>
    <div class="flex items-center text-[9px] tracking-widest uppercase bg-white pl-4 py-1">
      <button id="export-pdf-btn" onclick="exportSavedPDF()" class="hidden text-black underline hover:text-neutral-600 transition-colors cursor-pointer">EXPORT PDF</button>
    </div>
  </div>

  <!-- Seamless Feed Container -->
  <main id="archive-feed" class="max-w-4xl mx-auto divide-y divide-neutral-200 relative z-20">
    <!-- Dynamic slides load here automatically -->
  </main>

  <!-- Footer Layout -->
  <footer class="mt-20 mb-8 text-[7px] tracking-widest uppercase relative z-20">
    <!-- Row 1: Aligned Centrally Over 18px Horizontal Stitch Band -->
    <div class="relative h-[18px] flex items-center justify-center">
      <!-- Full-Width Horizontal 9-Stitch Background Overlay in Footer -->
      <div class="stitch-overlay-horizontal"></div>

      <div class="flex justify-between items-center w-full relative z-20 text-neutral-400 h-full leading-none">
        <p class="leading-none h-[18px] flex items-center">TERMINUS.DIRECTORY</p>

        <!-- Right-Aligned Link -->
        <a 
          href="https://terminus-ix.com" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="hover:text-black transition-colors underline cursor-pointer leading-none h-[18px] flex items-center"
        >
          TERMINUS-IX.COM
        </a>
      </div>
    </div>

    <!-- Row 2: Legal Disclaimer Centered Below the Stitch Band -->
    <div class="relative z-20 text-[7px] text-neutral-400 tracking-wider text-center lowercase mt-1">
      <span>we do not claim ownership of any images unless specified.</span>
    </div>

    <!-- Row 3: Sign Out — intentionally unobtrusive, only shown while
         signed in. Blends in with the footer rather than sitting up in
         the header where it'd be a prominent, obvious control. -->
    <div class="relative z-20 text-center mt-3">
      <button id="signout_widget" class="hidden appearance-none m-0 p-0 bg-transparent border-0 text-[7px] text-neutral-300 hover:text-neutral-500 transition-colors tracking-wider lowercase cursor-pointer">
        sign out
      </button>
    </div>
  </footer>

  <!-- Container for PDF Generation Engine -->
  <div id="print-stage"></div>

  <!-- Expanded Image Modal Lightbox -->
  <div 
    id="lightbox" 
    onclick="closeLightbox()" 
    class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md hidden flex items-center justify-center p-4 sm:p-8 cursor-zoom-out"
  >
    <img 
      id="lightbox-img" 
      src="" 
      alt="Expanded Research Item" 
      class="max-h-[90vh] max-w-[90vw] object-contain shadow-2xl transition-transform duration-200"
    >
    <button 
      onclick="closeLightbox()" 
      class="absolute top-6 right-6 text-neutral-500 hover:text-black text-[11px] uppercase tracking-widest"
    >
      [ CLOSE ✕ ]
    </button>
  </div>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
      
      const CLOUD_NAME = "nh2yb4q3";
      const UPLOAD_PRESET = "terminus_preset";

      // Real Firebase Authentication replaces the old client-side
      // FOUNDER_KEYS prompt system. That system only *looked* secure —
      // the keys lived in plain JS anyone could read via dev tools, and
      // nothing on the Firestore side actually enforced anything. Now,
      // writes/deletes are gated by Firestore Security Rules that check
      // a real signed-in user against a "founders" allowlist collection,
      // which the client can't fake or bypass.
      let currentUser = null;
      let currentFounderInitials = null;

      const firebaseConfig = {
        apiKey: "AIzaSyABHPBsfb7wLblLsipwidq4oQqrLdiUrho",
        authDomain: "terminus-projects-llc.firebaseapp.com",
        projectId: "terminus-projects-llc",
        storageBucket: "terminus-projects-llc.firebasestorage.app",
        messagingSenderId: "132476018158",
        appId: "1:132476018158:web:f47cc816139b3f403742ff",
        measurementId: "G-4ZSN6M7NG1"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();
      // Session-only persistence: a signed-in founder stays logged in only
      // while this browser tab/window is open, and is automatically signed
      // out when it's closed. This bounds how long an unattended/shared
      // device stays authenticated, without needing a visible sign-out
      // control for the common case.
      auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

      let allDocs = [];
      let currentMainTab = "all";
      let filterShowImages = true;
      let filterShowText = true;
      let savedIds = JSON.parse(localStorage.getItem("terminus_saved_cards") || "[]");
      // When signed in, savedIds is synced live from Firestore (savedLists/{uid})
      // instead of localStorage, so a person's saved items follow them across
      // devices. This tracks the active Firestore listener so we can detach it
      // cleanly on sign-out rather than leaking listeners across sessions.
      let savedListUnsubscribe = null;

      function updateSavedBadge() {
        // Only prune/persist against localStorage for signed-out (guest)
        // browsing. When signed in, Firestore is the source of truth and
        // is kept in sync separately via the savedLists listener.
        if (allDocs && allDocs.length > 0 && !currentUser) {
          const validSavedIds = savedIds.filter(id => allDocs.some(doc => doc.id === id));
          if (validSavedIds.length !== savedIds.length) {
            savedIds = validSavedIds;
            localStorage.setItem("terminus_saved_cards", JSON.stringify(savedIds));
          }
        }
        const badge = document.getElementById("saved-count");
        if (badge) badge.innerText = savedIds.length;
      }
      updateSavedBadge();

      // SEAMLESS CARD RENDERER
      function renderCard(docId, data, entryNum) {
        const isSaved = docId && savedIds.includes(docId);
        const captionText = data.caption || "RESEARCH";
        const signature = data.uploadedBy || "";
        const metaLine = signature ? `${captionText} | ${signature}` : captionText;
        const formattedNum = String(entryNum).padStart(3, '0');

        let mainContent = '';

        if (data.type === "link") {
          mainContent = `
            <div class="relative flex flex-col justify-center items-center text-center max-w-xl mx-auto w-full z-20 px-6">
              <div class="bg-white px-4 py-3 md:px-6 md:py-4 relative z-20 flex flex-col items-center justify-center">
                <span class="text-[9px] uppercase tracking-widest text-neutral-400 mb-2">EXTERNAL REFERENCE</span>
                <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="text-sm md:text-base font-bold text-black hover:underline break-all mb-2">
                  ${data.url}
                </a>
                ${data.note ? `<p class="text-[11px] text-neutral-600 tracking-wide uppercase mt-1">${data.note}</p>` : ''}
              </div>
            </div>
          `;
        } else if (data.type === "text") {
          mainContent = `
            <div class="relative flex flex-col justify-center items-center text-center max-w-2xl mx-auto w-full z-20 px-6">
              <div class="px-4 pt-0 pb-3 md:px-6 md:pt-0 md:pb-4 bg-white relative z-20">
                <p class="text-base md:text-lg font-bold text-black tracking-wide uppercase whitespace-pre-line leading-none">
                  ${data.textContent}
                </p>
              </div>
            </div>
          `;
        } else {
          mainContent = `
            <div class="relative py-8 flex justify-center items-center">
              <img 
                src="${data.imageUrl}" 
                alt="Research Item" 
                onclick="openLightbox('${data.imageUrl}')"
                class="max-h-[60vh] w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300 relative z-20 cursor-zoom-in bg-white"
                crossorigin="anonymous"
              >
            </div>
          `;
        }

        return `
          <article id="entry-${docId}" class="grid grid-rows-[auto_1fr_auto] min-h-[85vh] py-12 md:py-20">
            <div class="flex justify-between items-start text-[9px] tracking-widest text-neutral-500 uppercase">
              <span>TERMINUS</span>
              <span>${formattedNum}</span>
            </div>

            <div class="flex items-center justify-center">
              ${mainContent}
            </div>

            <div class="flex justify-between items-end text-[9px] tracking-widest text-neutral-400 uppercase">
              <div class="flex items-center space-x-2.5">
                ${docId ? `
                  <button 
                    onclick="toggleSave('${docId}')" 
                    class="${isSaved ? 'text-black' : 'text-neutral-500 hover:text-black'} transition-colors cursor-pointer flex items-center justify-center"
                    title="${isSaved ? 'Remove Bookmark' : 'Save Entry'}"
                  >
                    ${isSaved ? `
                      <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>
                    ` : `
                      <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>
                    `}
                  </button>
                  <button 
                    onclick="copyEntryLink('${docId}')" 
                    class="text-neutral-500 hover:text-black transition-colors cursor-pointer flex items-center justify-center relative" 
                    title="Copy Link to Entry"
                  >
                    <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" viewBox="0 0 24 24">
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                  </button>
                  <button 
                    onclick="deleteCard('${docId}')" 
                    class="text-neutral-500 hover:text-black transition-colors cursor-pointer flex items-center justify-center" 
                    title="Delete Entry"
                  >
                    <svg class="w-3 h-3 fill-none stroke-current" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                  <span id="copy-toast-${docId}" class="hidden text-[8px] text-black font-bold tracking-widest uppercase ml-1 transition-opacity">COPIED!</span>
                ` : ''}
              </div>
              <div>
                <span>${metaLine}</span>
              </div>
            </div>
          </article>
        `;
      }

      window.copyEntryLink = function(docId) {
        const shareUrl = `${window.location.origin}${window.location.pathname}#entry-${docId}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
          const toast = document.getElementById(`copy-toast-${docId}`);
          if (toast) {
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 1800);
          }
        }).catch(err => { alert("LINK: " + shareUrl); });
      };

      window.openLightbox = function(imageUrl) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = imageUrl;
        lightbox.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      };

      window.closeLightbox = function() {
        const lightbox = document.getElementById("lightbox");
        lightbox.classList.add("hidden");
        document.body.style.overflow = "auto";
      };

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closeLightbox();
      });

      window.toggleSave = function(docId) {
        if (currentUser) {
          // Signed in: write straight to Firestore. The savedLists listener
          // (set up in onAuthStateChanged) will pick up the change and
          // re-render automatically — no need to touch savedIds locally here.
          const isSaved = savedIds.includes(docId);
          db.collection("savedLists").doc(currentUser.uid).set({
            postIds: isSaved
              ? firebase.firestore.FieldValue.arrayRemove(docId)
              : firebase.firestore.FieldValue.arrayUnion(docId)
          }, { merge: true }).catch(function(err) {
            alert("Error updating saved list: " + err.message);
          });
        } else {
          // Signed out: fall back to the original localStorage-only behavior
          // so guests can still save/export without an account.
          if (savedIds.includes(docId)) {
            savedIds = savedIds.filter(id => id !== docId);
          } else {
            savedIds.push(docId);
          }
          localStorage.setItem("terminus_saved_cards", JSON.stringify(savedIds));
          updateSavedBadge();
          renderFeed();
        }
      };

      window.switchMainTab = function(tab) {
        currentMainTab = tab;
        const allBtn = document.getElementById("tab-all");
        const savedBtn = document.getElementById("tab-saved");
        const exportBtn = document.getElementById("export-pdf-btn");

        if (tab === "all") {
          allBtn.className = "appearance-none m-0 p-0 bg-transparent border-0 font-bold text-black cursor-pointer leading-none flex items-center h-[18px]";
          savedBtn.className = "appearance-none m-0 p-0 bg-transparent border-0 text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none flex items-center h-[18px]";
          exportBtn.classList.add("hidden");
        } else {
          savedBtn.className = "appearance-none m-0 p-0 bg-transparent border-0 font-bold text-black cursor-pointer leading-none flex items-center h-[18px]";
          allBtn.className = "appearance-none m-0 p-0 bg-transparent border-0 text-neutral-400 hover:text-black transition-colors cursor-pointer leading-none flex items-center h-[18px]";
          if (savedIds.length > 0) exportBtn.classList.remove("hidden");
        }
        renderFeed();
      };

      window.toggleIndexFilter = function(type) {
        // Compute what the new state would be without applying it yet.
        const nextImages = (type === 'images') ? !filterShowImages : filterShowImages;
        const nextText = (type === 'text') ? !filterShowText : filterShowText;

        // At least one filter must always stay active — ignore the click
        // if it would turn both off.
        if (!nextImages && !nextText) return;

        filterShowImages = nextImages;
        filterShowText = nextText;

        const btnImages = document.getElementById("subtab-images");
        const btnText = document.getElementById("subtab-text");

        btnImages.className = filterShowImages ? "font-bold text-black cursor-pointer transition-colors" : "text-neutral-400 hover:text-black cursor-pointer transition-colors";
        btnText.className = filterShowText ? "font-bold text-black cursor-pointer transition-colors" : "text-neutral-400 hover:text-black cursor-pointer transition-colors";

        renderFeed();
      };

      window.deleteCard = function(docId) {
        if (!currentUser) {
          alert("PLEASE SIGN IN TO DELETE ENTRIES.");
          return;
        }
        if (confirm("Permanently delete this research card?")) {
          if (savedIds.includes(docId)) toggleSave(docId);
          db.collection("posts").doc(docId).delete().catch(error => alert("Error deleting card: " + error.message));
        }
      };

      // BULLETPROOF SAFARI-COMPATIBLE PDF EXPORT ENGINE
      //
      // Two Safari-specific fixes are combined here:
      //
      // 1. window.open() is called SYNCHRONOUSLY on click (before any await),
      //    because Safari's popup blocker only allows window.open() inside the
      //    original user-gesture call stack. We then redirect that already-open
      //    window to the blob URL once the PDF is ready, with a download-link
      //    fallback if the popup ever does get blocked.
      //
      // 2. Instead of letting html2pdf.js auto-detect page breaks via CSS
      //    (mode: 'css'), which relies on `page-break-after` — a property
      //    that WebKit/Safari does not reliably honor inside flex containers —
      //    we render each saved entry to its own canvas individually and
      //    manually place it on its own fixed-size PDF page with jsPDF.
      //    This guarantees exactly one entry per page with no blank leading
      //    page and no CSS page-break guessing.
      window.exportSavedPDF = async function() {
        if (savedIds.length === 0) return;

        // Open the window immediately, synchronously, inside the click handler.
        const pdfWindow = window.open('', '_blank');
        if (pdfWindow) {
          pdfWindow.document.write('Generating your archive…');
        }

        const stage = document.getElementById("print-stage");
        stage.innerHTML = "";
        // Keep it out of the visible flow instead of display:none, so
        // html2canvas measures/rasterizes it reliably in every browser.
        stage.style.cssText = "display: block; position: fixed; top: 0; left: -10000px;";

        const docsToRender = allDocs.filter(doc => savedIds.includes(doc.id));
        const totalDocs = allDocs.length;

        const PAGE_W = 800;
        const PAGE_H = 1050;

        // html2canvas has unreliable support for CSS repeating-linear-gradient,
        // so instead of relying on the gradient used for the on-screen stitch
        // line, we bake the same pattern into a tiny raster tile (a real PNG)
        // and use it as a tiled background image. html2canvas renders actual
        // images correctly, which the gradient version was not doing.
        function buildStitchTileDataURL() {
          const tile = document.createElement('canvas');
          tile.width = 2;
          tile.height = 2;
          const ctx = tile.getContext('2d');
          ctx.clearRect(0, 0, 2, 2);
          ctx.fillStyle = 'rgba(179, 179, 179, 0.65)'; // #b3b3b3 @ 0.65 opacity
          ctx.fillRect(0, 0, 1, 2); // 1px colored column, 1px transparent column
          return tile.toDataURL('image/png');
        }
        const stitchTileDataURL = buildStitchTileDataURL();

        function formatDateMMDDYY(timestamp) {
          if (!timestamp || typeof timestamp.toDate !== "function") return "";
          const d = timestamp.toDate();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const yy = String(d.getFullYear()).slice(-2);
          return `${mm}/${dd}/${yy}`;
        }

        function buildPageDiv(doc) {
          const data = doc.data();
          const docId = doc.id;
          const indexInAll = allDocs.findIndex(d => d.id === docId);
          const entryNum = totalDocs - indexInAll;
          const formattedNum = String(entryNum).padStart(3, '0');
          const captionText = data.caption || "RESEARCH";
          const signature = data.uploadedBy || "";
          const metaLine = signature ? `${captionText} | ${signature}` : captionText;
          const uploadDate = formatDateMMDDYY(data.createdAt);

          let bodyHTML = '';
          if (data.type === "link") {
            bodyHTML = `<div style="margin: auto; text-align: center; font-size: 12px; font-weight: bold; text-transform: uppercase;"><span style="background: #ffffff; padding: 15px; display: inline-block;">${data.url}</span></div>`;
          } else if (data.type === "text") {
            bodyHTML = `<div style="margin: auto; text-align: center; font-size: 12px; text-transform: uppercase; padding: 0 30px;"><span style="background: #ffffff; padding: 15px; display: inline-block;">${data.textContent}</span></div>`;
          } else {
            bodyHTML = `
              <div style="margin: auto; text-align: center; display: flex; justify-content: center; align-items: center; flex: 1;">
                <img src="${data.imageUrl}" alt="Research Item" style="max-height: 500px; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; background: #fff;" crossorigin="anonymous">
              </div>
            `;
          }

          const pageDiv = document.createElement("div");
          pageDiv.style.cssText = `width: ${PAGE_W}px; height: ${PAGE_H}px; padding: 50px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: space-between; background: #ffffff;`;
          pageDiv.innerHTML = `
            <div style="position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 18px; pointer-events: none; background-image: url('${stitchTileDataURL}'); background-repeat: repeat;"></div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: #737373; text-transform: uppercase; position: relative; z-index: 2;">
              <span>TERMINUS</span>
              <span>${formattedNum}</span>
            </div>
            <div style="position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center;">
              ${bodyHTML}
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: #737373; text-transform: uppercase; position: relative; z-index: 2;">
              <span>${uploadDate}</span>
              <span>${metaLine}</span>
            </div>
          `;
          return pageDiv;
        }

        function waitForImages(container) {
          const images = container.querySelectorAll("img");
          return Promise.all(Array.from(images).map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => {
              img.onload = resolve;
              img.onerror = resolve;
            });
          }));
        }

        try {
          // jsPDF and html2canvas are loaded explicitly via their own
          // <script> tags in <head>, so they're guaranteed to be at
          // window.jspdf.jsPDF and window.html2canvas (UMD globals).
          const jsPDF = window.jspdf && window.jspdf.jsPDF;
          if (!jsPDF) {
            throw new Error("jsPDF library failed to load (window.jspdf.jsPDF is missing). Check that the jspdf <script> tag in <head> is loading correctly.");
          }
          if (typeof window.html2canvas !== "function") {
            throw new Error("html2canvas library failed to load (window.html2canvas is missing). Check that the html2canvas <script> tag in <head> is loading correctly.");
          }
          const pdf = new jsPDF({ unit: 'px', format: [PAGE_W, PAGE_H], orientation: 'portrait' });

          for (let i = 0; i < docsToRender.length; i++) {
            const pageDiv = buildPageDiv(docsToRender[i]);
            stage.innerHTML = "";
            stage.appendChild(pageDiv);

            await waitForImages(pageDiv);

            const canvas = await window.html2canvas(pageDiv, {
              scale: 2,
              useCORS: true,
              backgroundColor: '#ffffff',
              logging: false,
              width: PAGE_W,
              height: PAGE_H
            });

            const imgData = canvas.toDataURL('image/jpeg', 0.98);

            if (i > 0) pdf.addPage([PAGE_W, PAGE_H], 'portrait');
            pdf.addImage(imgData, 'JPEG', 0, 0, PAGE_W, PAGE_H);
          }

          stage.style.cssText = "display: none;";
          stage.innerHTML = "";

          const blob = pdf.output('blob');
          const blobURL = URL.createObjectURL(blob);

          if (pdfWindow && !pdfWindow.closed) {
            // Redirect the already-open window to the finished PDF.
            pdfWindow.location.href = blobURL;
          } else {
            // Popup was blocked despite the synchronous open (rare) —
            // fall back to a forced download link.
            const link = document.createElement('a');
            link.href = blobURL;
            link.download = 'terminus-directory-archive.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
          }
        } catch (err) {
          stage.style.cssText = "display: none;";
          stage.innerHTML = "";
          if (pdfWindow && !pdfWindow.closed) pdfWindow.close();
          console.error("PDF generation error:", err);
          alert("PDF EXPORT FAILED: " + (err && err.message ? err.message : err));
        }
      };

      function renderFeed() {
        const feedContainer = document.getElementById("archive-feed");
        feedContainer.innerHTML = ""; 

        let docsToRender = allDocs;

        if (currentMainTab === "saved") {
          docsToRender = allDocs.filter(doc => savedIds.includes(doc.id));
        }

        docsToRender = docsToRender.filter(doc => {
          const type = doc.data().type || "image";
          const isImage = (type === "image");
          const isTextOrLink = (type === "text" || type === "link");

          if (isImage && filterShowImages) return true;
          if (isTextOrLink && filterShowText) return true;
          return false;
        });

        if (docsToRender.length === 0) {
          feedContainer.innerHTML = `
            <div class="text-center py-24 text-[11px] text-neutral-400 uppercase tracking-widest">
              NO ENTRIES FOUND IN THIS SECTION.
            </div>
          `;
          updateSavedBadge();
          return;
        }

        let totalDocs = allDocs.length;
        docsToRender.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;
          const indexInAll = allDocs.findIndex(d => d.id === docId);
          const entryNum = totalDocs - indexInAll;
          feedContainer.insertAdjacentHTML("beforeend", renderCard(docId, data, entryNum));
        });

        updateSavedBadge();

        if (window.location.hash) {
          const target = document.querySelector(window.location.hash);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 300);
          }
        }
      }

      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allDocs = snapshot.docs;
        renderFeed();
      });

      const myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'url', 'camera'],
        multiple: false,
        maxFiles: 1
      }, (error, result) => { 
        if (!error && result && result.event === "success") {
          const uploadedUrl = result.info.secure_url;
          const userCaption = prompt("ENTER A 2-3 WORD DESCRIPTION FOR THIS ENTRY:", "RESEARCH");
          const finalCaption = (userCaption && userCaption.trim() !== "") ? userCaption.trim().toUpperCase() : "RESEARCH";

          db.collection("posts").add({
            type: "image",
            imageUrl: uploadedUrl,
            caption: finalCaption,
            uploadedBy: currentFounderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      });

      // AUTH STATE — the single source of truth for who's signed in.
      // Firestore Security Rules independently re-check this server-side
      // on every write, so this client-side gate is just for UX (showing/
      // hiding buttons); it isn't what's actually protecting the data.
      auth.onAuthStateChanged(function(user) {
        currentUser = user;

        // Detach any previous savedLists listener before switching users
        // (or signing out), so we never leak a listener tied to the wrong
        // account or keep querying after sign-out.
        if (savedListUnsubscribe) {
          savedListUnsubscribe();
          savedListUnsubscribe = null;
        }

        if (user) {
          db.collection("founders").doc(user.uid).get().then(function(doc) {
            currentFounderInitials = doc.exists ? (doc.data().initials || "TRMNS") : "TRMNS";
            updateAuthUI();
          }).catch(function() {
            currentFounderInitials = "TRMNS";
            updateAuthUI();
          });

          // Live-sync saved items from Firestore so they follow this
          // person across phone/computer/any device they sign into.
          savedListUnsubscribe = db.collection("savedLists").doc(user.uid)
            .onSnapshot(function(doc) {
              savedIds = doc.exists ? (doc.data().postIds || []) : [];
              updateSavedBadge();
              renderFeed();
            }, function(err) {
              console.error("savedLists listener error:", err);
            });
        } else {
          currentFounderInitials = null;
          // Signed out: fall back to whatever's in localStorage for guest
          // browsing on this device.
          savedIds = JSON.parse(localStorage.getItem("terminus_saved_cards") || "[]");
          updateAuthUI();
          updateSavedBadge();
          renderFeed();
        }
      });

      function updateAuthUI() {
        const signInBtn = document.getElementById("signin_widget");
        const uploadBtn = document.getElementById("upload_widget");
        const signOutBtn = document.getElementById("signout_widget");
        if (!signInBtn || !uploadBtn || !signOutBtn) return;

        if (currentUser) {
          // No sign-out control up in the header — it lives quietly in the
          // footer instead (see signout_widget), so it's available without
          // being a prominent, obvious button. Session persistence is also
          // set to SESSION above, so closing the browser signs them out
          // naturally either way.
          signInBtn.classList.add("hidden");
          uploadBtn.classList.remove("hidden");
          signOutBtn.classList.remove("hidden");
        } else {
          signInBtn.innerText = "SIGN IN";
          signInBtn.classList.remove("hidden");
          uploadBtn.classList.add("hidden");
          signOutBtn.classList.add("hidden");
        }
      }

      const signOutBtn = document.getElementById("signout_widget");
      if (signOutBtn) {
        signOutBtn.addEventListener("click", function() {
          auth.signOut();
        });
      }

      const signInBtn = document.getElementById("signin_widget");
      if (signInBtn) {
        signInBtn.addEventListener("click", function() {
          const email = prompt("EMAIL:");
          if (!email || email.trim() === "") return;
          const password = prompt("PASSWORD:");
          if (!password || password.trim() === "") return;

          auth.signInWithEmailAndPassword(email.trim(), password).catch(function(err) {
            alert("SIGN IN FAILED: " + err.message);
          });
        });
      }

      const uploadBtn = document.getElementById("upload_widget");
      if (uploadBtn) {
        uploadBtn.addEventListener("click", function(){
          if (!currentUser) {
            alert("PLEASE SIGN IN FIRST.");
            return;
          }

          if (filterShowText && !filterShowImages) {
            handleTextOrLinkUpload();
          } else if (filterShowImages && !filterShowText) {
            myWidget.open();
          } else {
            const choice = prompt("SELECT UPLOAD TYPE:\n1 = IMAGE\n2 = TEXT NOTE / LINK", "1");
            if (choice === "1") myWidget.open();
            else if (choice === "2") handleTextOrLinkUpload();
          }
        });
      }

      function handleTextOrLinkUpload() {
        const entryType = prompt("ENTER ENTRY TYPE:\n1 = LINK / URL\n2 = TEXT NOTE", "1");
        
        if (entryType === "1") {
          const urlInput = prompt("ENTER FULL URL (e.g. https://example.com):");
          if (!urlInput || urlInput.trim() === "") return;
          const noteInput = prompt("ENTER BRIEF NOTE OR CAPTION (OPTIONAL):", "REFERENCE LINK");
          
          db.collection("posts").add({
            type: "link",
            url: urlInput.trim(),
            note: noteInput ? noteInput.trim().toUpperCase() : "",
            caption: "LINK ENTRY",
            uploadedBy: currentFounderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else if (entryType === "2") {
          const textInput = prompt("ENTER YOUR TEXT NOTE OR EXCERPT:");
          if (!textInput || textInput.trim() === "") return;
          const captionInput = prompt("ENTER A 2-3 WORD DESCRIPTION:", "NOTE");

          db.collection("posts").add({
            type: "text",
            textContent: textInput.trim(),
            caption: captionInput ? captionInput.trim().toUpperCase() : "NOTE",
            uploadedBy: currentFounderInitials || "TRMNS",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }

    });
  </script>

</body>
