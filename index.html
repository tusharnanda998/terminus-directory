<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINUS.DIRECTORY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudinary Upload Widget Script -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .writing-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="bg-neutral-100 text-black antialiased min-h-screen p-4 md:p-12">

  <!-- Header -->
  <header class="flex justify-between items-center border-b border-neutral-300 pb-4 mb-8 text-[11px] tracking-widest uppercase">
    <div>
      <h1 class="font-bold tracking-tight">TERMINUS.DIRECTORY</h1>
      <p class="text-neutral-400">RESEARCH ARCHIVE</p>
    </div>
    <div class="flex items-center space-x-4">
      <button id="upload_widget" class="bg-black text-white px-3 py-1 text-[9px] hover:bg-neutral-800 transition-colors uppercase">
        + UPLOAD ENTRY
      </button>
      <span class="text-neutral-500">[INDEX]</span>
    </div>
  </header>

  <!-- Feed Container -->
  <main id="archive-feed" class="max-w-4xl mx-auto space-y-12">
    <!-- Dynamic slides load here automatically -->
  </main>

  <footer class="mt-16 pt-6 border-t border-neutral-300 text-neutral-400 text-[10px] flex justify-between font-mono">
    <p>&copy; TERMINUS.DIRECTORY</p>
    <p>ALL RIGHTS RESERVED.</p>
  </footer>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
      
      // 1. CLOUDINARY & TEAM CONFIG
      const CLOUD_NAME = "nh2yb4q3";
      const UPLOAD_PRESET = "terminus_preset";
      const ADMIN_PASSCODE = "Glendale";

      // 2. PASTE YOUR FIREBASE KEYS HERE
      const firebaseConfig = {
        apiKey: "AIzaSyABHPBsfb7wLblLsipwidq4oQqrLdiUrho",
        authDomain: "terminus-projects-llc.firebaseapp.com",
        projectId: "terminus-projects-llc",
        storageBucket: "terminus-projects-llc.firebasestorage.app",
        messagingSenderId: "132476018158",
        appId: "1:132476018158:web:f47cc816139b3f403742ff"
      };

      // Initialize Firebase & Firestore
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // 3. CARD TEMPLATE RENDERER
      function renderCard(imageUrl, entryNum) {
        return `
          <article class="relative bg-white border border-neutral-300 p-8 sm:p-12 min-h-[75vh] flex flex-col justify-between shadow-sm">
            <div class="flex justify-between items-start text-[9px] tracking-widest text-neutral-500 uppercase font-mono">
              <span>TERMINUS ©</span>
              <span>${entryNum} / 333</span>
            </div>

            <div class="relative my-auto py-8 flex justify-center items-center">
              <div class="absolute right-0 top-1/2 -translate-y-1/2 writing-vertical text-[8px] tracking-widest text-neutral-400 uppercase font-mono select-none pointer-events-none">
                PROTOTYPE DEPICTED. SUBJECT TO CHANGE.
              </div>
              <img 
                src="${imageUrl}" 
                alt="Research Item" 
                class="max-h-[50vh] w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300"
              >
            </div>

            <div class="flex justify-between items-end text-[9px] tracking-widest text-neutral-400 uppercase font-mono">
              <span>LOOK ${entryNum}</span>
              <span>TRMNS</span>
            </div>
          </article>
        `;
      }

      // 4. AUTOMATICALLY LOAD & DISPLAY ALL SAVED SLIDES
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const feedContainer = document.getElementById("archive-feed");
        feedContainer.innerHTML = ""; 

        if (snapshot.empty) {
          feedContainer.innerHTML = renderCard("https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80", "001");
          return;
        }

        let totalDocs = snapshot.docs.length;
        snapshot.docs.forEach((doc, index) => {
          const data = doc.data();
          const entryNum = String(totalDocs - index).padStart(3, '0');
          feedContainer.insertAdjacentHTML("beforeend", renderCard(data.imageUrl, entryNum));
        });
      });

      // 5. CLOUDINARY UPLOAD & PERMANENT DATABASE SAVE
      const myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'url', 'camera'],
        multiple: false,
        maxFiles: 1
      }, (error, result) => { 
        if (!error && result && result.event === "success") {
          const uploadedUrl = result.info.secure_url;
          
          // Save permanently to Firebase database
          db.collection("posts").add({
            imageUrl: uploadedUrl,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      });

      // Passcode Prompt Handler
      const uploadBtn = document.getElementById("upload_widget");
      if (uploadBtn) {
        uploadBtn.addEventListener("click", function(){
          const userInput = prompt("ENTER ACCESS KEY:");
          if (userInput === ADMIN_PASSCODE) {
            myWidget.open();
          } else if (userInput !== null) {
            alert("ACCESS DENIED: INVALID KEY");
          }
        });
      }
    });
  </script>

</body>
</html>
